[project]
name = "communitylab"
version = "0.1.0"
description = "CommunityLab: Motor Inteligente de Transformação e Distribuição para Comunidades Digitais."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "duckdb>=0.10.0",
    "extra-streamlit-components>=0.1.71",
    "jsonschema[format]>=4.22.0",
    "oci>=2.125.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "streamlit>=1.35.0",
    "streamlit-shadcn-ui>=1.4.0",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
